[project]
name = "relic5"
version = "0.1.0"
description = "One hub on white for every machine's extracted history and vectors: push, import, embed, serve"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "fastapi>=0.115",
    "lancedb==0.40.0",
    "pylance==13.0.0", "numpy>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
embed = ["sentence-transformers==6.2.0", "torch==2.14.1", "transformers==5.20.2"]   # Mac clients only (encode.py)

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyarrow>=17"]

[project.scripts]
relic5 = "relic5.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic5"]
artifacts = ["src/relic5/web/*.html"]
