[project]
license = "AGPL-3.0-or-later"
name = "relic5"
version = "26.10.31a1151"
description = "One hub on white for every machine's extracted history and vectors: push, import, embed, serve"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.5",
    "fastapi>=0.115",
    "httpx>=0.27",   # serve's start-up warm-up calls its own pages through httpx's ASGI transport (api.py _warm)
    "lancedb==0.40.0",
    "pylance==13.0.0", "numpy>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
embed = ["sentence-transformers==6.2.0", "torch==2.14.1", "transformers==5.20.2"]   # Mac clients only (encode.py)
ane2 = ["coremltools==9.0"]   # engine ane2 (ane2.py): runs ANEEmbedBar's compiled packages in-process

[dependency-groups]
dev = [
    "pytest>=8",
    "pyarrow>=17",
    "mypy>=2.4.0",
]

[project.scripts]
relic5 = "relic5.cli:main"
# the same CLI under the name the Rust client (cli/) hands hub-side commands to; `relic5` stays for the hub's venv
relic5-core = "relic5.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relic5"]
artifacts = ["src/relic5/web/*.html", "src/relic5/web/assets/*", "src/relic5/icons/*"]

[tool.mypy]
# Strict typing for src/relic5, enforced by tests/test_types.py (Nat, 2026-10-24: "can python have a strong type?").
strict = true
python_version = "3.12"
files = ["src/relic5"]

[[tool.mypy.overrides]]
# no type information shipped: their values are typed where they enter our code. torch / sentence_transformers are the
# optional `embed` extra (Mac clients only), coremltools the `ane2` extra: a venv without them must still type-check clean
module = ["pyarrow", "pyarrow.*", "lancedb", "lancedb.*", "duckdb", "uvicorn", "numpy", "numpy.*", "torch", "torch.*",
          "sentence_transformers", "sentence_transformers.*", "coremltools", "coremltools.*"]
ignore_missing_imports = true
