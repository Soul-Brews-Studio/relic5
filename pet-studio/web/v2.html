      frames, make the sprite, send it to the pet; an agent can do every step on the same sheet.
      FIRST VIEWPORT: the seven states as big lowercase words across the top; one yellow band with the
      next step and its action; tools as a sticker strip left; the artboard as the largest sticker,
      centred, framed by registration marks; "On the pet" preview top right; the frame strip below.
