[package]
name = "relic5"
# the version is pyproject's (one source); build.rs turns it into the CalVer `relic5 --version` prints
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/Soul-Brews-Studio/relic5"
description = "relic5 command line: the hub client in Rust; every hub-side command goes to the Python core (relic5-core)"

[[bin]]
name = "relic5"
path = "src/main.rs"

# One binary, two engines for a no-hub `search` (#311), picked when it is built:
#   py (default)                  every embedded read goes to the Python core (relic5-core local-call)
#   rs (--features native)        `search` reads the BM25 index with lancedb in-process (the same lance as the core's), no
#                                 Python needed; every other embedded read still goes to the core, and
#                                 RELIC5_LOCAL_ENGINE=py sends search there too
#   just cli --engine rs          (cargo install --path cli --profile native --features native)

[features]
native = ["dep:lancedb", "dep:lance-index", "dep:lance-tokenizer", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-cast", "dep:tokio", "dep:futures", "dep:parquet", "dep:regex", "dep:sha1_smol", "dep:base64"]

[dependencies]
# same crates as relic4-scan and relic-extract
ureq = { version = "3", default-features = false, features = ["rustls"] }
# preserve_order: keys print in the hub's order; arbitrary_precision: numbers print as the hub wrote them,
# so `--json` output is the same bytes as the Python CLI's json.dumps(indent=1)
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
libc = "0.2"
serde = "1"
# relic-scan's TUI crates, same versions
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# native engine only (feature "native"): pinned to what the Python core's lancedb 0.40.0 / pylance 13.0.0 run, so a
# query gets the same BM25 scores either way
# "remote": lancedb 0.40.0 does not compile without it (job.rs names Error::Http); the Python wheel is built with it too
lancedb = { version = "=0.40.0", default-features = false, features = ["remote"], optional = true }
lance-index = { version = "=13.0.0", default-features = false, optional = true }
lance-tokenizer = { version = "=13.0.0", default-features = false, optional = true }
arrow-array = { version = "58", optional = true }
arrow-schema = { version = "58", optional = true }
arrow-cast = { version = "58", optional = true }
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
futures = { version = "0.3", optional = true }
regex = { version = "1", optional = true }
sha1_smol = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }

# the native engine pulls lance + datafusion: thin LTO keeps its build under an hour
[profile.native]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
